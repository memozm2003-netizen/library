<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5c4d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>برنامج المكتبة</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f1e7;--card:#fffdf8;--ink:#23302b;--muted:#6d776f;--line:#e4dccb;
  --brand:#1f5c4d;--brand2:#2f7a67;--accent:#b8862b;--ok:#2b7a4b;--warn:#b8862b;--bad:#b3392f;
  --okbg:#e3f1e7;--warnbg:#f7ecd2;--badbg:#f6dedb;
  --r:14px;--sh:0 1px 2px rgba(35,48,43,.08),0 4px 14px rgba(35,48,43,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141a18;--card:#1c2421;--ink:#e8eee9;--muted:#9aa89f;--line:#2c3834;
    --brand:#5fb9a0;--brand2:#7fd0b8;--accent:#e0b457;--ok:#6fcf93;--warn:#e0b457;--bad:#ef8a80;
    --okbg:#1d3a2a;--warnbg:#3a3220;--badbg:#3f2522}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",system-ui,sans-serif;font-size:16px;line-height:1.5;overscroll-behavior-y:contain}
#app{display:flex;flex-direction:column;height:100dvh;max-width:760px;margin:0 auto;position:relative}
header{background:var(--brand);color:#fff;padding:14px 16px 12px;flex:none}
header h1{margin:0;font-size:18px;font-weight:700}
header .sub{font-size:12.5px;opacity:.85;margin-top:2px}
main{flex:1;overflow-y:auto;padding:12px 12px 90px;-webkit-overflow-scrolling:touch}
nav{flex:none;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:9px 2px 8px;font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--brand);font-weight:700}
.bar{display:flex;gap:8px;margin-bottom:10px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(47,122,103,.18)}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.chips{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 13px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;margin-bottom:8px;box-shadow:var(--sh);display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.card.static{cursor:default;flex-direction:column;align-items:stretch}
.num{flex:none;min-width:44px;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 6px;font-size:13px;font-weight:700;color:var(--brand)}
.grow{flex:1;min-width:0}
.t{font-weight:700;overflow-wrap:anywhere}
.s{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.pill{flex:none;font-size:12px;border-radius:999px;padding:2px 10px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.btn{border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:700;background:var(--brand);color:#fff;cursor:pointer}
.btn.alt{background:var(--card);color:var(--brand);border:1px solid var(--brand)}
.btn.bad{background:var(--bad)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.fab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));inset-inline-start:max(16px,calc(50% - 364px));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;z-index:5}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.more{width:100%;margin:6px 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--sh)}
.stat b{display:block;font-size:26px;color:var(--brand);line-height:1.2}
.stat span{font-size:13px;color:var(--muted)}
.stat.bad b{color:var(--bad)}
h3{font-size:15px;margin:16px 2px 8px;color:var(--brand)}
.barrow{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13.5px}
.barrow .lb{flex:0 0 42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow .bg{flex:1;background:var(--bg);border-radius:6px;height:14px;overflow:hidden}
.barrow .fg{height:100%;background:var(--brand2);border-radius:6px}
.barrow .v{flex:none;min-width:26px;text-align:left;font-weight:700}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20}
#sheet{position:fixed;inset-inline:0;bottom:0;max-width:760px;margin:0 auto;background:var(--bg);border-radius:22px 22px 0 0;max-height:92dvh;overflow-y:auto;padding:16px 14px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s;z-index:21;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
#sheet.on{transform:none}
#sheet h2{margin:0 0 6px;font-size:18px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:15px}
.kv span:first-child{color:var(--muted)}
#toast{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.note{background:var(--warnbg);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.note.bad{background:var(--badbg)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;font:inherit;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--brand);color:#fff;font-weight:700}
bdi{unicode-bidi:isolate}

</style>
</head>

<script>
/* قارئ إكسل مبسّط (xlsx و csv) بدون مكتبات خارجية */
const XL = (() => {
  const u16 = (d, o) => d[o] | (d[o + 1] << 8);
  const u32 = (d, o) => (d[o] | (d[o + 1] << 8) | (d[o + 2] << 16) | (d[o + 3] << 24)) >>> 0;

  async function inflateRaw(bytes) {
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  async function unzip(buf) {
    const d = new Uint8Array(buf);
    let e = d.length - 22;
    while (e >= 0 && u32(d, e) !== 0x06054b50) e--;
    if (e < 0) throw new Error('الملف مو بصيغة xlsx صحيحة');
    const count = u16(d, e + 10);
    let p = u32(d, e + 16);
    const files = {};
    const dec = new TextDecoder('utf-8');
    for (let i = 0; i < count; i++) {
      if (u32(d, p) !== 0x02014b50) break;
      const method = u16(d, p + 10);
      const csize = u32(d, p + 20);
      const nlen = u16(d, p + 28), xlen = u16(d, p + 30), clen = u16(d, p + 32);
      const lho = u32(d, p + 42);
      const name = dec.decode(d.subarray(p + 46, p + 46 + nlen));
      files[name] = { method, csize, lho };
      p += 46 + nlen + xlen + clen;
    }
    return {
      async read(name) {
        const f = files[name];
        if (!f) return null;
        const o = f.lho;
        const start = o + 30 + u16(d, o + 26) + u16(d, o + 28);
        const raw = d.subarray(start, start + f.csize);
        const out = f.method === 0 ? raw : await inflateRaw(raw);
        return dec.decode(out);
      },
      names: () => Object.keys(files),
    };
  }

  const colIndex = (ref) => {
    let n = 0;
    for (const ch of ref.replace(/[0-9]/g, '')) n = n * 26 + (ch.charCodeAt(0) - 64);
    return n - 1;
  };

  function parseXml(s) {
    return new DOMParser().parseFromString(s, 'application/xml');
  }

  async function readXlsx(buf) {
    const z = await unzip(buf);
    const ss = [];
    const sstXml = await z.read('xl/sharedStrings.xml');
    if (sstXml) {
      const doc = parseXml(sstXml);
      doc.querySelectorAll('si').forEach((si) => {
        ss.push(Array.from(si.querySelectorAll('t')).map((t) => t.textContent).join(''));
      });
    }
    let sheetName = null;
    const wb = await z.read('xl/workbook.xml');
    const rels = await z.read('xl/_rels/workbook.xml.rels');
    if (wb && rels) {
      const first = parseXml(wb).querySelector('sheet');
      const rid = first && (first.getAttribute('r:id') || first.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id'));
      if (rid) {
        for (const r of parseXml(rels).querySelectorAll('Relationship')) {
          if (r.getAttribute('Id') === rid) {
            let t = r.getAttribute('Target');
            t = t.replace(/^\/?(xl\/)?/, '');
            sheetName = 'xl/' + t;
          }
        }
      }
    }
    if (!sheetName || !z.names().includes(sheetName)) {
      sheetName = z.names().filter((n) => /^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()[0];
    }
    if (!sheetName) throw new Error('ما لقيت ورقة بيانات داخل الملف');
    const doc = parseXml(await z.read(sheetName));
    const rows = [];
    doc.querySelectorAll('sheetData > row').forEach((row) => {
      const r = [];
      let seq = 0;
      row.querySelectorAll(':scope > c').forEach((c) => {
        const ref = c.getAttribute('r');
        const ci = ref ? colIndex(ref) : seq;
        seq = ci + 1;
        const t = c.getAttribute('t');
        let v = '';
        if (t === 'inlineStr') v = Array.from(c.querySelectorAll('t')).map((x) => x.textContent).join('');
        else {
          const ve = c.querySelector(':scope > v');
          if (ve) v = t === 's' ? (ss[parseInt(ve.textContent, 10)] ?? '') : ve.textContent;
        }
        r[ci] = v;
      });
      const rn = parseInt(row.getAttribute('r') || '0', 10);
      if (rn > 0) while (rows.length < rn - 1) rows.push([]);
      rows.push(r);
    });
    return rows;
  }

  function readCsv(text) {
    if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);
    const first = text.split('\n', 1)[0];
    const sep = (first.match(/\t/g) || []).length > (first.match(/,/g) || []).length ? '\t' : (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
    const rows = [];
    let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
        else cur += ch;
      } else if (ch === '"') q = true;
      else if (ch === sep) { row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(cur); cur = ''; rows.push(row); row = [];
      } else cur += ch;
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }

  async function readFile(file) {
    const buf = await file.arrayBuffer();
    if (/\.(csv|txt|tsv)$/i.test(file.name)) return readCsv(new TextDecoder('utf-8').decode(buf));
    return readXlsx(buf);
  }

  return { readFile, readXlsx, readCsv };
})();

</script>

<script>

'use strict';
const $ = (s) => document.querySelector(s);

const toDigits = (s) => String(s ?? '').replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const norm = (s) => String(s ?? '').replace(/[ً-ْٰـ]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي').toLowerCase().replace(/\s+/g, ' ').trim();
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const addDays = (s, n) => { const [y, m, d] = s.split('-').map(Number); return ymd(new Date(y, m - 1, d + n)); };
const diffDays = (a, b) => { const pa = a.split('-').map(Number), pb = b.split('-').map(Number); return Math.round((Date.UTC(pa[0], pa[1] - 1, pa[2]) - Date.UTC(pb[0], pb[1] - 1, pb[2])) / 864e5); };
const D = (s) => s ? '<bdi>' + esc(s.replace(/-/g, '/')) + '</bdi>' : '';
const num = (v, def = 0) => { const n = parseInt(toDigits(v), 10); return Number.isFinite(n) ? n : def; };

const S = {
  db: null, volatile: false, books: new Map(), sx: new Map(), members: new Map(), loans: [], openByBook: new Map(),
  meta: {}, tab: 'books', q: '', flt: 'all', typ: '', limit: 50, mq: '', mlimit: 50, lseg: 'cur', llimit: 60,
  draft: null, afterMember: null, importRows: null, fakeId: 1,

/* ---------- قاعدة البيانات ---------- */
function openDB() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('no idb'));
    const r = indexedDB.open('nubl-library', 1);
    r.onupgradeneeded = () => {
      const db = r.result;
      db.createObjectStore('books', { keyPath: 'id' });
      db.createObjectStore('members', { keyPath: 'id', autoIncrement: true });
      db.createObjectStore('loans', { keyPath: 'id', autoIncrement: true });
      db.createObjectStore('meta', { keyPath: 'k' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
const getAll = (store) => new Promise((res, rej) => {
  const r = S.db.transaction(store).objectStore(store).getAll();
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
const put = (store, obj) => new Promise((res, rej) => {
  if (!S.db) return res(obj.id ?? S.fakeId++);
  const t = S.db.transaction(store, 'readwrite');
  const r = t.objectStore(store).put(obj);
  t.oncomplete = () => res(r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
});
const putMany = (store, arr) => new Promise((res, rej) => {
  if (!S.db) return res();
  const t = S.db.transaction(store, 'readwrite');
  const st = t.objectStore(store);
  for (const o of arr) st.put(o);
  t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
});
const del = (store, key) => new Promise((res, rej) => {
  if (!S.db) return res();
  const t = S.db.transaction(store, 'readwrite');
  t.objectStore(store).delete(key);
  t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
});
const clearStores = (names) => new Promise((res, rej) => {
  if (!S.db) return res();
  const t = S.db.transaction(names, 'readwrite');
  names.forEach((n) => t.objectStore(n).clear());
  t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
});
const setMeta = (k, v) => { S.meta[k] = v; return put('meta', { k, v }); };

const mkSx = (b) => norm(b.title + ' ' + (b.author || '') + ' ' + (b.type || '')) + ' ' + b.id;
const cleanBook = (o) => ({ id: o.id, title: String(o.title || '').trim(), author: String(o.author || '').trim(), type: String(o.type || '').trim(), vol: String(o.vol ?? '').trim() });
function indexBooks(arr) { for (const b of arr) { S.books.set(b.id, b); S.sx.set(b.id, mkSx(b)); } }
function rebuildOpen() {
  S.openByBook = new Map();
  for (const l of S.loans) if (!l.returned) S.openByBook.set(l.bookId, l);
}
const isOver = (l) => !l.returned && l.due < today();

async function load() {
  try { S.db = await openDB(); } catch (e) { S.db = null; S.volatile = true; }
  if (S.db) {
    const [bs, ms, ls, mt] = await Promise.all([getAll('books'), getAll('members'), getAll('loans'), getAll('meta')]);
    indexBooks(bs);
    ms.forEach((m) => S.members.set(m.id, m));
    S.loans = ls;
    mt.forEach((x) => (S.meta[x.k] = x.v));
  }
  if (!S.meta.seeded && S.books.size === 0 && window.SEED_BOOKS) {
    const arr = window.SEED_BOOKS.map((o) => cleanBook({ id: o.n, title: o.t, author: o.a, type: o.k, vol: o.v }));
    indexBooks(arr);
    await putMany('books', arr);
    await setMeta('seeded', 1);
  }
  rebuildOpen();
}

};
const TABS = [['books', 'الكتب', 'books'], ['members', 'الأعضاء', 'users'], ['loans', 'الإعارة', 'loan'], ['reports', 'التقارير', 'chart'], ['settings', 'الإعدادات', 'gear']];

/* ---------- الكتب ---------- */
function typeOptions() {
  const c = new Map();
  for (const b of S.books.values()) if (b.type) c.set(b.type, (c.get(b.type) || 0) + 1);
  return [...c.entries()].sort((a, b) => b[1] - a[1]).map((x) => x[0]);
}
function needBackup() {
  if (!S.loans.length && !S.members.size) return false;
  return !S.meta.lastBackup || diffDays(today(), S.meta.lastBackup) > 14;
}
function viewBooks() {
  const types = typeOptions();
  $('#view').innerHTML = `
    ${S.volatile ? '<div class="note bad">التخزين غير متاح بهذا المتصفح، البيانات رح تضيع عند الإغلاق. افتح التطبيق من Chrome.</div>' : ''}
    ${needBackup() ? '<div class="note">ما عملت نسخة احتياطية من فترة. <b data-act="tab" data-k="settings" style="text-decoration:underline;cursor:pointer">عمل نسخة الآن</b></div>' : ''}
    <div class="bar"><input id="q" type="search" placeholder="ابحث بالعنوان أو المؤلف أو الرقم…" value="${esc(S.q)}" autocomplete="off"></div>
    <div class="chips">
      ${[['all', 'الكل'], ['in', 'المتاح'], ['out', 'المعار']].map(([k, l]) => `<button class="chip ${S.flt === k ? 'on' : ''}" data-act="flt" data-k="${k}">${l}</button>`).join('')}

  drawBooks();
}
function filteredBooks() {
  const q = norm(toDigits(S.q));
  const toks = q ? q.split(' ') : [];
  const out = [];
  for (const b of S.books.values()) {
    if (S.flt === 'in' && S.openByBook.has(b.id)) continue;
    if (S.flt === 'out' && !S.openByBook.has(b.id)) continue;
    if (S.typ && b.type !== S.typ) continue;
    if (toks.length) { const s = S.sx.get(b.id); let ok = true; for (const t of toks) if (!s.includes(t)) { ok = false; break; } if (!ok) continue; }
    out.push(b);
  }
  const exact = /^\d+$/.test(q) ? Number(q) : null;
  out.sort((a, b) => (exact !== null ? (b.id === exact) - (a.id === exact) : 0) || a.id - b.id);
  return out;
}
function bookCard(b) {
  const l = S.openByBook.get(b.id);

async function doLoan() {

  const b = S.books.get(bookId), m = S.members.get(memberId);
  const l = { bookId, memberId, bt: b.title, mn: m.name, out: today(), due: addDays(today(), days), returned: null };
  l.id = await put('loans', l);
  if (!S.db) l.id = S.fakeId++;
  S.loans.push(l); S.openByBook.set(bookId, l); S.draft = null;
  closeSheet(); render(); toast('تمت الإعارة');
}
async function doReturn(lid) {
  const l = S.loans.find((x) => x.id === lid); if (!l || l.returned) return;
  l.returned = today(); await put('loans', l); S.openByBook.delete(l.bookId);
  closeSheet(); render(); toast('تم الإرجاع');
}
async function doRenew(lid) {
  const l = S.loans.find((x) => x.id === lid); if (!l || l.returned) return;
  l.due = addDays(today(), loanDays()); l.renewals = (l.renewals || 0) + 1; await put('loans', l);
  closeSheet(); render(); toast('تم التجديد حتى ' + l.due.replace(/-/g, '/'));

function viewLoans() {

  list = list.sort((a, b) => S.lseg === 'all' ? (b.out > a.out ? 1 : b.out < a.out ? -1 : b.id - a.id) : (a.due > b.due ? 1 : -1));

/* ---------- التقارير ---------- */
function bars(items, max) {
  max = max || Math.max(1, ...items.map((i) => i[1]));
  return items.map(([l, v]) => `<div class="barrow"><span class="lb">${esc(l)}</span><span class="bg"><span class="fg" style="display:block;width:${Math.max(3, (v / max) * 100)}%"></span></span><span class="v">${v}</span></div>`).join('') || '<div class="s">لا يوجد بيانات بعد</div>';
}
function viewReports() {
  const t = today(), ym = t.slice(0, 7);
  const copies = S.books.size, out = S.openByBook.size;
  const titles = new Set([...S.books.values()].map((b) => norm(b.title))).size;
  const over = S.loans.filter(isOver).length;
  const monthLoans = S.loans.filter((l) => l.out.startsWith(ym)).length;
  const cnt = (keyFn) => { const m = new Map(); for (const l of S.loans) { const k = keyFn(l); m.set(k, (m.get(k) || 0) + 1); } return [...m.entries()].sort((a, b) => b[1] - a[1]); };
  const topBooks = cnt((l) => bookTitle(l)).slice(0, 8);
  const topMem = cnt((l) => memberName(l)).slice(0, 5);
  const months = [];
  for (let i = 5; i >= 0; i--) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); const k = d.getFullYear() + '-' + pad(d.getMonth() + 1); months.push([k.replace('-', '/'), S.loans.filter((l) => l.out.startsWith(k)).length]); }
  const tc = new Map(); for (const b of S.books.values()) { const k = b.type || '(بدون نوع)'; tc.set(k, (tc.get(k) || 0) + 1); }
  const byType = [...tc.entries()].sort((a, b) => b[1] - a[1]).slice(0, 8);
  $('#view').innerHTML = `
    <div class="grid">
      <div class="stat"><b>${copies}</b><span>إجمالي النسخ</span></div>
      <div class="stat"><b>${titles}</b><span>عناوين مختلفة</span></div>
      <div class="stat"><b>${copies - out}</b><span>متاح للإعارة</span></div>
      <div class="stat"><b>${out}</b><span>معار حالياً</span></div>
      <div class="stat ${over ? 'bad' : ''}"><b>${over}</b><span>متأخر</span></div>
      <div class="stat"><b>${S.members.size}</b><span>الأعضاء</span></div>
      <div class="stat"><b>${monthLoans}</b><span>إعارات هذا الشهر</span></div>
      <div class="stat"><b>${S.loans.length}</b><span>إجمالي الإعارات</span></div>
    </div>
    ${over ? `<button class="btn alt" style="width:100%" data-act="goLate">عرض الكتب المتأخرة</button>` : ''}
    <h3>الإعارات خلال آخر 6 أشهر</h3>${bars(months)}
    <h3>أكثر الكتب استعارة</h3>${bars(topBooks)}
    <h3>أكثر الأعضاء استعارة</h3>${bars(topMem)}
    <h3>توزيع الكتب حسب النوع</h3>${bars(byType)}`;
}

}

}
async function backup() {
  const data = { app: 'nubl-library', v: 1, date: new Date().toISOString(), meta: { libName: S.meta.libName, days: S.meta.days }, books: [...S.books.values()], members: [...S.members.values()], loans: S.loans };
  download('library-backup-' + today() + '.json', JSON.stringify(data), 'application/json');
  await setMeta('lastBackup', today()); viewSettings(); toast('تم تنزيل النسخة');
}
async function onRestore(e) {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (d.app !== 'nubl-library' || !Array.isArray(d.books)) throw new Error('x');
    if (!confirm(`استرجاع النسخة؟ رح تُستبدل كل البيانات الحالية بـ ${d.books.length} كتاب و ${(d.members || []).length} عضو و ${(d.loans || []).length} إعارة.`)) return;
    await clearStores(['books', 'members', 'loans']);
    S.books = new Map(); S.sx = new Map(); S.members = new Map();
    const bs = d.books.map(cleanBook); indexBooks(bs); await putMany('books', bs);
    (d.members || []).forEach((m) => S.members.set(m.id, m)); await putMany('members', d.members || []);
    S.loans = d.loans || []; await putMany('loans', S.loans);
    if (d.meta) { if (d.meta.libName) await setMeta('libName', d.meta.libName); if (d.meta.days) await setMeta('days', d.meta.days); }
    await setMeta('seeded', 1); rebuildOpen(); render(); toast('تم استرجاع النسخة');
  } catch (err) { toast('الملف مو نسخة احتياطية صحيحة'); }
}
function parseBookRows(rows) {
  let hi = rows.findIndex((r) => r && r.some((c) => { const n = norm(c); return n.includes('اسم') && n.includes('كتاب') || n.includes('عنوان'); }));
  if (hi < 0) hi = 0;
  const h = (rows[hi] || []).map((c) => norm(c));
  const find = (f) => h.findIndex((x) => x && f(x));
  const cT = find((x) => x.includes('اسم') || x.includes('عنوان') || x.includes('title'));
  if (cT < 0) throw new Error('ما لقيت عمود "اسم الكتاب" بالصف الأول');
  const cI = find((x) => x.includes('رقم') || x.includes('تسلسل') || x === 'id');
  const cA = find((x) => x.includes('مولف') || x.includes('author'));
  const cK = find((x) => x.includes('نوع') || x.includes('تصنيف'));
  const cV = find((x) => x.includes('جز'));
  const out = []; let skipped = 0;
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i] || [];
    const title = String(r[cT] ?? '').replace(/\s+/g, ' ').trim();
    if (!title) { if (r.some((c) => String(c ?? '').trim())) skipped++; continue; }
    const rawId = cI >= 0 ? String(r[cI] ?? '').trim() : '';
    out.push({ id: rawId ? num(rawId, 0) : 0, title, author: cA >= 0 ? String(r[cA] ?? '').replace(/\s+/g, ' ').trim() : '', type: cK >= 0 ? String(r[cK] ?? '').trim() : '', vol: cV >= 0 ? toDigits(String(r[cV] ?? '').trim()) : '' });
  }
  return { list: out, skipped };
}
async function onExcel(e) {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  toast('عم قرأ الملف…');
  try {
    const rows = await XL.readFile(f);
    const { list, skipped } = parseBookRows(rows);
    if (!list.length) throw new Error('ما في كتب بالملف');
    let next = nextBookId(), nw = 0, upd = 0; const seen = new Set();
    for (const b of list) {
      if (!b.id || seen.has(b.id)) b.id = 0;
      if (!b.id) { while (S.books.has(next) || seen.has(next)) next++; b.id = next; }
      seen.add(b.id);
      if (S.books.has(b.id)) upd++; else nw++;
    }
    S.importRows = list;
    openSheet(`<h2>معاينة الاستيراد</h2>
      <div class="kv"><span>الملف</span><span><bdi>${esc(f.name)}</bdi></span></div>
      <div class="kv"><span>عدد الصفوف المقروءة</span><b>${list.length}</b></div>
      <div class="kv"><span>كتب جديدة</span><b>${nw}</b></div>
      <div class="kv"><span>كتب موجودة (تتحدّث)</span><b>${upd}</b></div>
      ${skipped ? `<div class="kv"><span>صفوف بدون عنوان (تم تجاهلها)</span><b>${skipped}</b></div>` : ''}
      <div class="s" style="margin-top:10px">مثال: ${esc(list[0].title)} — ${esc(list[0].author)}</div>
      <div class="row" style="margin-top:16px"><button class="btn" data-act="doImport">استيراد الآن</button><button class="btn alt" data-act="close">إلغاء</button></div>`);
  } catch (err) { toast(err.message || 'تعذّر قراءة الملف'); }
}
async function doImport() {
  const list = S.importRows; if (!list) return;
  const arr = list.map(cleanBook);
  await putMany('books', arr); indexBooks(arr);
  S.importRows = null; closeSheet(); render(); toast(`تم استيراد ${arr.length} كتاب`);
}
function expBooks() {
  const rows = [['الرقم المتسلسل', 'اسم الكتاب', 'المؤلف', 'نوع الكتاب', 'عدد الأجزاء', 'الحالة']];
  [...S.books.values()].sort((a, b) => a.id - b.id).forEach((b) => rows.push([b.id, b.title, b.author, b.type, b.vol, S.openByBook.has(b.id) ? 'معار' : 'متاح']));
  download('books-' + today() + '.csv', toCsv(rows), 'text/csv;charset=utf-8');
}
function expLoans() {
  const rows = [['الكتاب', 'رقم الكتاب', 'العضو', 'تاريخ الإعارة', 'تاريخ الاستحقاق', 'تاريخ الإرجاع']];
  S.loans.forEach((l) => rows.push([bookTitle(l), l.bookId, memberName(l), l.out, l.due, l.returned || '']));
  download('loans-' + today() + '.csv', toCsv(rows), 'text/csv;charset=utf-8');
}
async function wipe() {
  if (!confirm('رح تنمسح كل الكتب والأعضاء والإعارات نهائياً. متأكد؟')) return;
  if (!confirm('تأكيد أخير: ما في رجعة إلا بنسخة احتياطية.')) return;
  await clearStores(['books', 'members', 'loans']);
  S.books = new Map(); S.sx = new Map(); S.members = new Map(); S.loans = []; rebuildOpen();
  await setMeta('seeded', 1); render(); toast('تم المسح');
}

/* ---------- الأحداث ---------- */
const A = {
  tab: (el) => { S.tab = el.dataset.k; render(); $('#view').scrollTop = 0; },
  flt: (el) => { S.flt = el.dataset.k; S.limit = 50; viewBooks(); },
  moreBooks: () => { S.limit += 50; drawBooks(); },
  moreMembers: () => { S.mlimit += 50; drawMembers(); },
  moreLoans: () => { S.llimit += 60; viewLoans(); },
  book: (el) => bookSheet(+el.dataset.id),
  newBook: () => bookForm(0),
  editBook: (el) => bookForm(+el.dataset.id),
  saveBook: (el) => saveBook(+el.dataset.id || 0),
  delBook: (el) => delBook(+el.dataset.id),
  lendBook: (el) => { S.draft = { bookId: +el.dataset.id, memberId: null }; startLoan(); },
  newLoan: () => { S.draft = { bookId: null, memberId: null }; startLoan(); },
  lendTo: (el) => { S.draft = { bookId: null, memberId: +el.dataset.id }; startLoan(); },
  pickBook: (el) => { S.draft.bookId = +el.dataset.id; startLoan(); },
  pickMember: (el) => { S.draft.memberId = +el.dataset.id; startLoan(); },
  newMemberInLoan: () => { S.afterMember = (id) => { S.draft.memberId = id; startLoan(); }; memberForm(0); },
  doLoan: () => doLoan(),
  return: (el) => doReturn(+el.dataset.lid),
  renew: (el) => doRenew(+el.dataset.lid),
  lseg: (el) => { S.lseg = el.dataset.k; S.llimit = 60; viewLoans(); },
  goLate: () => { S.tab = 'loans'; S.lseg = 'late'; render(); },
  member: (el) => memberSheet(+el.dataset.id),
  newMember: () => { S.afterMember = null; memberForm(0); },
  editMember: (el) => memberForm(+el.dataset.id),
  saveMember: (el) => saveMember(+el.dataset.id || 0),
  delMember: (el) => delMember(+el.dataset.id),
  saveSettings, backup, expBooks, expLoans, wipe, doImport,
  restore: () => $('#file-js').click(),
  importXl: () => $('#file-xl').click(),
  close: () => { S.afterMember = null; closeSheet(); },
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (el && A[el.dataset.act]) { e.preventDefault(); Promise.resolve(A[el.dataset.act](el)).catch((err) => { console.error(err); toast('صار خطأ، جرّب مرة ثانية'); }); }
});
$('#shade').addEventListener('click', () => { S.afterMember = null; closeSheet(); });

/* ---------- تشغيل ---------- */
(async () => {
  await load();
  render();
  if (S.db && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
window.__lib = S; // للفحص
})();
