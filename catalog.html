<title>فهرس مكتبة المركز الثقافي في نبل</title>
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#23302b;--muted:#6d776f;--line:#e4dccb;--brand:#1f5c4d;--brand2:#2f7a67}
@media (prefers-color-scheme:dark){:root{--bg:#141a18;--card:#1c2421;--ink:#e8eee9;--muted:#9aa89f;--line:#2c3834;--brand:#5fb9a0;--brand2:#7fd0b8}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",system-ui,sans-serif;font-size:16px;line-height:1.5}
header{background:var(--brand);color:#fff;padding:18px 16px 16px}
header .in,main{max-width:760px;margin:0 auto}
header h1{margin:0;font-size:20px}
header p{margin:4px 0 0;font-size:13.5px;opacity:.9}
main{padding:14px 16px 40px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(47,122,103,.18)}
.row{display:grid;gap:10px;margin-bottom:10px}
.s{font-size:13.5px;color:var(--muted)}
.cnt{margin:6px 2px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.num{flex:none;min-width:46px;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 6px;font-size:13px;font-weight:700;color:var(--brand)}
.g{flex:1;min-width:0}
.t{font-weight:700;overflow-wrap:anywhere}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
button.more{width:100%;border:1px solid var(--brand);background:var(--card);color:var(--brand);border-radius:12px;padding:12px;font:inherit;font-weight:700;cursor:pointer;margin-top:6px}
footer{max-width:760px;margin:0 auto;padding:0 16px 30px;text-align:center}
</style>
</head>

<script>
(function () {
'use strict';
var $ = function (s) { return document.querySelector(s); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var digits = function (s) { return String(s == null ? '' : s).replace(/[٠-٩]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); }).replace(/[۰-۹]/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d); }); };
var norm = function (s) { return String(s == null ? '' : s).replace(/[ً-ْٰـ]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي').toLowerCase().replace(/\s+/g, ' ').trim(); };

function readCsv(text) {
  if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);
  var first = text.split('\n', 1)[0];
  var c = (first.match(/,/g) || []).length, t = (first.match(/\t/g) || []).length, sc = (first.match(/;/g) || []).length;
  var sep = t > c && t >= sc ? '\t' : sc > c ? ';' : ',';
  var rows = [], row = [], cur = '', q = false;
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; rows.push(row); row = []; }
    else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
function parseBooks(rows) {
  var hi = 0;
  for (var i = 0; i < rows.length; i++) { var j = rows[i].map(norm).join('|'); if (j.indexOf('كتاب') > -1 && (j.indexOf('اسم') > -1 || j.indexOf('عنوان') > -1)) { hi = i; break; } }
  var h = (rows[hi] || []).map(norm);
  var find = function (f) { for (var k = 0; k < h.length; k++) if (h[k] && f(h[k])) return k; return -1; };
  var cT = find(function (x) { return x.indexOf('اسم') > -1 || x.indexOf('عنوان') > -1; });
  if (cT < 0) throw new Error('header');
  var cI = find(function (x) { return x.indexOf('رقم') > -1 || x.indexOf('تسلسل') > -1; });
  var cA = find(function (x) { return x.indexOf('مولف') > -1; });
  var cK = find(function (x) { return x.indexOf('نوع') > -1 || x.indexOf('تصنيف') > -1; });
  var cV = find(function (x) { return x.indexOf('جز') > -1; });
  var out = [];
  for (var r = hi + 1; r < rows.length; r++) {
    var x = rows[r] || [];
    var title = String(x[cT] == null ? '' : x[cT]).replace(/\s+/g, ' ').trim();
    if (!title) continue;
    var id = cI >= 0 ? parseInt(digits(x[cI]), 10) : NaN;
    out.push({ n: isFinite(id) ? id : out.length + 1, t: title, a: cA >= 0 ? String(x[cA] || '').replace(/\s+/g, ' ').trim() : '', k: cK >= 0 ? String(x[cK] || '').trim() : '', v: cV >= 0 ? digits(String(x[cV] || '').trim()) : '' });
  }
  return out;
}

var books = [], sx = [], limit = 50;
function setBooks(list) {
  books = list.slice().sort(function (a, b) { return a.n - b.n; });
  sx = books.map(function (b) { return norm(b.t + ' ' + b.a + ' ' + b.k) + ' ' + b.n; });
  var c = {};
  books.forEach(function (b) { if (b.k) c[b.k] = (c[b.k] || 0) + 1; });
  var types = Object.keys(c).sort(function (a, b) { return c[b] - c[a]; });
  var sel = $('#typ'), cur = sel.value;
  sel.innerHTML = '<option value="">كل الأنواع</option>' + types.map(function (t) { return '<option>' + esc(t) + '</option>'; }).join('');
  sel.value = types.indexOf(cur) > -1 ? cur : '';
  $('#sub').textContent = books.length + ' كتاب';
  draw();
}
function draw() {
  var toks = norm(digits($('#q').value)).split(' ').filter(Boolean), typ = $('#typ').value, out = [];
  for (var i = 0; i < books.length; i++) {
    var b = books[i];
    if (typ && b.k !== typ) continue;
    var ok = true;
    for (var j = 0; j < toks.length; j++) if (sx[i].indexOf(toks[j]) < 0) { ok = false; break; }
    if (ok) out.push(b);
  }
  $('#cnt').textContent = out.length + ' نتيجة';
  var html = out.slice(0, limit).map(function (b) {
    return '<div class="card"><div class="num">' + b.n + '</div><div class="g"><div class="t">' + esc(b.t) + '</div><div class="s">' + esc(b.a || 'بدون مؤلف') + (b.k ? ' · ' + esc(b.k) : '') + (b.v ? ' · جزء ' + esc(b.v) : '') + '</div></div></div>';
  }).join('');
  if (!out.length) html = '<div class="empty">ما في نتائج مطابقة</div>';
  if (out.length > limit) html += '<button class="more" id="more">عرض المزيد (' + (out.length - limit) + ')</button>';
  $('#list').innerHTML = html;
  var m = $('#more'); if (m) m.onclick = function () { limit += 50; draw(); };
}
$('#q').addEventListener('input', function () { limit = 50; draw(); });
$('#typ').addEventListener('change', function () { limit = 50; draw(); });

setBooks(window.FALLBACK_BOOKS || []);
fetch('books.csv', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
  .then(function (buf) { var list = parseBooks(readCsv(new TextDecoder('utf-8').decode(buf))); if (list.length) { limit = 50; setBooks(list); } })
  .catch(function () { /* ما في books.csv: بيبقى الفهرس الاحتياطي */ });
})();
</script>
